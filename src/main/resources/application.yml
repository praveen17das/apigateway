
server:
  port: 8080

spring:

  application:
    name: API-GATEWAY

  cloud:
    gateway:

      routes:

        # SECURITY SERVICE
        - id: security-service
          uri: lb://SECURITY
          predicates:
            - Path=/auth/**

        # EMPLOYEE SERVICE
        - id: employee-service
          uri: lb://EMPLOYEE-SERVICE
          predicates:
            - Path=/employees/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka